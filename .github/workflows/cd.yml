name: CD

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir versión
        id: version
        run: echo "version=v1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-tp:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-tp:${{ steps.version.outputs.version }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Setear versión en Render
        run: |
          curl -X PUT \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/env-vars/APP_VERSION" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"value": "${{ needs.publish.outputs.version }}"}'

      - name: Disparar deploy en Render
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
